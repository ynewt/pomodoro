<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.5s;
    }

    .container {
      text-align: center;
      color: white;
      min-width: 340px;
    }

    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }

    .mode-label {
      font-size: 1rem;
      opacity: 0.85;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Tomato shape */
    .tomato {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 2rem;
    }

    .tomato-body {
      width: 280px;
      height: 260px;
      background: #c0392b;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      position: absolute;
      bottom: 0;
      box-shadow: inset -15px -15px 30px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.1);
    }

    .tomato-stem {
      width: 8px;
      height: 30px;
      background: #5d8c3e;
      border-radius: 4px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .tomato-leaf {
      position: absolute;
      top: 18px;
      z-index: 1;
    }

    .tomato-leaf-left {
      left: 50%;
      transform: translateX(-80%) rotate(-30deg);
      width: 50px;
      height: 20px;
      background: #6ba34a;
      border-radius: 0 80% 0 80%;
    }

    .tomato-leaf-right {
      left: 50%;
      transform: translateX(-20%) rotate(30deg);
      width: 50px;
      height: 20px;
      background: #6ba34a;
      border-radius: 80% 0 80% 0;
    }

    .tomato-highlight {
      position: absolute;
      top: 50px;
      left: 60px;
      width: 40px;
      height: 60px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .timer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      font-size: 4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 3;
    }

    .controls { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; }

    .controls button {
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(255,255,255,0.4); }

    .modes { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

    .modes button {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid transparent;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .modes button:hover { background: rgba(255,255,255,0.35); }
    .modes button.active { border-color: white; }

    .session-count {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Color picker settings */
    .settings {
      position: fixed;
      top: 1rem;
      right: 1rem;
    }

    .settings-toggle {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .settings-toggle:hover { background: rgba(255,255,255,0.35); }

    .settings-panel {
      display: none;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 1.2rem;
      margin-top: 0.5rem;
      min-width: 200px;
      text-align: left;
      color: white;
    }

    .settings-panel.open { display: block; }

    .settings-panel label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }

    .settings-panel input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .settings-panel hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
      margin: 0.75rem 0;
    }

    .settings-panel input[type="number"] {
      width: 52px;
      padding: 0.25rem 0.4rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 0.85rem;
      text-align: center;
    }

    .settings-panel input[type="number"]::-webkit-inner-spin-button { opacity: 1; }

    /* Celebration overlay */
    .celebration {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
    }

    .celebration.active { display: flex; }

    .celebration canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .celebration-content {
      position: relative;
      z-index: 101;
      text-align: center;
      color: white;
    }

    .celebration-content h2 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .celebration-content p {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 1.5rem;
    }

    .animal-photo {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 4px solid white;
      background: rgba(255,255,255,0.1);
    }

    .celebration-content button {
      margin-top: 1.5rem;
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .celebration-content button:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="settings">
    <button class="settings-toggle" onclick="document.getElementById('settingsPanel').classList.toggle('open')">&#9881;</button>
    <div class="settings-panel" id="settingsPanel">
      <label>Work <input type="color" id="colorWork" value="#e74c3c" onchange="updateColor('work', this.value)"></label>
      <label>Short Break <input type="color" id="colorShort" value="#27ae60" onchange="updateColor('short', this.value)"></label>
      <label>Long Break <input type="color" id="colorLong" value="#2980b9" onchange="updateColor('long', this.value)"></label>
      <hr>
      <label>Work (min) <input type="number" id="timeWork" value="25" min="1" max="120" onchange="updateTime('work', this.value)"></label>
      <label>Short (min) <input type="number" id="timeShort" value="5" min="1" max="60" onchange="updateTime('short', this.value)"></label>
      <label>Long (min) <input type="number" id="timeLong" value="15" min="1" max="60" onchange="updateTime('long', this.value)"></label>
    </div>
  </div>

  <div class="container">
    <h1>Pomodoro Timer</h1>
    <div class="mode-label" id="modeLabel">Work</div>

    <div class="tomato">
      <div class="tomato-stem"></div>
      <div class="tomato-leaf tomato-leaf-left"></div>
      <div class="tomato-leaf tomato-leaf-right"></div>
      <div class="tomato-body">
        <div class="tomato-highlight"></div>
      </div>
      <div class="timer" id="timer">25:00</div>
    </div>

    <div class="controls">
      <button id="startBtn" onclick="toggleTimer()">Start</button>
      <button onclick="resetTimer()">Reset</button>
    </div>

    <div class="modes">
      <button class="active" id="btnWork" onclick="setMode('work')">Work (25m)</button>
      <button id="btnShort" onclick="setMode('short')">Short Break (5m)</button>
      <button id="btnLong" onclick="setMode('long')">Long Break (15m)</button>
    </div>

    <div class="session-count">Sessions completed: <span id="sessions">0</span></div>
  </div>

  <div class="celebration" id="celebration">
    <canvas id="fireworksCanvas"></canvas>
    <div class="celebration-content">
      <h2>Great work!</h2>
      <p>You earned a break. Enjoy this cute animal:</p>
      <img class="animal-photo" id="animalPhoto" src="" alt="Cute animal">
      <br>
      <button onclick="dismissCelebration()">Continue</button>
    </div>
  </div>

  <script>
    const MODES = {
      work:  { minutes: 25, label: "Work",        color: "#e74c3c" },
      short: { minutes: 5,  label: "Short Break",  color: "#27ae60" },
      long:  { minutes: 15, label: "Long Break",   color: "#2980b9" },
    };

    // Load saved colors and times from localStorage
    ["work", "short", "long"].forEach(mode => {
      const savedColor = localStorage.getItem("pomodoro-color-" + mode);
      if (savedColor) {
        MODES[mode].color = savedColor;
        document.getElementById("color" + mode.charAt(0).toUpperCase() + mode.slice(1)).value = savedColor;
      }
      const savedTime = localStorage.getItem("pomodoro-time-" + mode);
      if (savedTime) {
        MODES[mode].minutes = parseInt(savedTime, 10);
        document.getElementById("time" + mode.charAt(0).toUpperCase() + mode.slice(1)).value = MODES[mode].minutes;
      }
    });

    let currentMode = "work";
    let totalSeconds = MODES.work.minutes * 60;
    let remaining = totalSeconds;
    let interval = null;
    let running = false;
    let sessions = 0;

    const timerEl    = document.getElementById("timer");
    const startBtn   = document.getElementById("startBtn");
    const modeLabel  = document.getElementById("modeLabel");
    const sessionsEl = document.getElementById("sessions");

    function applyColor(mode) {
      document.body.style.background = MODES[mode].color;
    }

    function updateColor(mode, color) {
      MODES[mode].color = color;
      localStorage.setItem("pomodoro-color-" + mode, color);
      if (currentMode === mode) applyColor(mode);
    }

    function updateTime(mode, value) {
      const mins = Math.max(1, parseInt(value, 10) || 1);
      MODES[mode].minutes = mins;
      localStorage.setItem("pomodoro-time-" + mode, mins);
      updateModeButtons();
      if (currentMode === mode && !running) {
        totalSeconds = mins * 60;
        remaining = totalSeconds;
        display(remaining);
      }
    }

    function updateModeButtons() {
      document.getElementById("btnWork").textContent  = `Work (${MODES.work.minutes}m)`;
      document.getElementById("btnShort").textContent = `Short Break (${MODES.short.minutes}m)`;
      document.getElementById("btnLong").textContent  = `Long Break (${MODES.long.minutes}m)`;
    }

    function display(secs) {
      const m = String(Math.floor(secs / 60)).padStart(2, "0");
      const s = String(secs % 60).padStart(2, "0");
      timerEl.textContent = `${m}:${s}`;
      document.title = `${m}:${s} - Pomodoro`;
    }

    function toggleTimer() {
      if (running) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = "Start";
      } else {
        running = true;
        startBtn.textContent = "Pause";
        interval = setInterval(() => {
          remaining--;
          display(remaining);
          if (remaining <= 0) {
            clearInterval(interval);
            running = false;
            startBtn.textContent = "Start";
            onTimerEnd();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(interval);
      running = false;
      startBtn.textContent = "Start";
      remaining = totalSeconds;
      display(remaining);
    }

    function setMode(mode) {
      clearInterval(interval);
      running = false;
      startBtn.textContent = "Start";
      currentMode = mode;
      totalSeconds = MODES[mode].minutes * 60;
      remaining = totalSeconds;
      display(remaining);
      modeLabel.textContent = MODES[mode].label;
      applyColor(mode);

      document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
      document.getElementById("btn" + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add("active");
    }

    // --- Fireworks ---
    const canvas = document.getElementById("fireworksCanvas");
    const ctx = canvas.getContext("2d");
    let fireworks = [];
    let particles = [];
    let fireworksRAF = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Firework {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height;
        this.targetY = canvas.height * (0.15 + Math.random() * 0.35);
        this.speed = 4 + Math.random() * 3;
        this.hue = Math.random() * 360;
        this.alive = true;
      }
      update() {
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.alive = false;
          for (let i = 0; i < 60; i++) {
            particles.push(new Particle(this.x, this.y, this.hue));
          }
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
        ctx.fill();
      }
    }

    class Particle {
      constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.hue = hue + (Math.random() * 40 - 20);
        this.size = 1.5 + Math.random() * 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.04;
        this.alpha -= 0.012;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
        ctx.fill();
        ctx.restore();
      }
    }

    function fireworksLoop() {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.08) fireworks.push(new Firework());

      fireworks = fireworks.filter(f => { f.update(); f.draw(); return f.alive; });
      particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });

      fireworksRAF = requestAnimationFrame(fireworksLoop);
    }

    function startFireworks() {
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireworks = [];
      particles = [];
      // Launch a burst immediately
      for (let i = 0; i < 5; i++) fireworks.push(new Firework());
      fireworksLoop();
    }

    function stopFireworks() {
      if (fireworksRAF) cancelAnimationFrame(fireworksRAF);
      fireworksRAF = null;
      fireworks = [];
      particles = [];
    }

    window.addEventListener("resize", () => {
      if (fireworksRAF) resizeCanvas();
    });

    // --- Animal photos ---
    const ANIMAL_APIS = [
      "https://place.dog/300/300",
      "https://cataas.com/cat?width=300&height=300",
      "https://placebear.com/300/300",
    ];

    function getRandomAnimalUrl() {
      // Cache-bust with random param
      const base = ANIMAL_APIS[Math.floor(Math.random() * ANIMAL_APIS.length)];
      const sep = base.includes("?") ? "&" : "?";
      return base + sep + "cb=" + Date.now();
    }

    // --- Celebration ---
    function showCelebration() {
      const overlay = document.getElementById("celebration");
      const photo = document.getElementById("animalPhoto");
      photo.src = getRandomAnimalUrl();
      overlay.classList.add("active");
      startFireworks();
    }

    function dismissCelebration() {
      const overlay = document.getElementById("celebration");
      overlay.classList.remove("active");
      stopFireworks();
    }

    function onTimerEnd() {
      if (Notification.permission === "granted") {
        new Notification("Pomodoro", { body: MODES[currentMode].label + " session complete!" });
      }

      if (currentMode === "work") {
        sessions++;
        sessionsEl.textContent = sessions;
        showCelebration();
        setMode(sessions % 4 === 0 ? "long" : "short");
      } else {
        setMode("work");
      }
    }

    // Request notification permission on first interaction
    document.addEventListener("click", () => {
      if (Notification.permission === "default") Notification.requestPermission();
    }, { once: true });

    // Initialize
    totalSeconds = MODES.work.minutes * 60;
    remaining = totalSeconds;
    updateModeButtons();
    applyColor(currentMode);
    display(remaining);
  </script>
</body>
</html>
